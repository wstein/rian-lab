name: CI

# Locks the component suite + the external-toolchain lanes (rustc/node/kotlinc) via
# `mix test.all` (ADR-0049), plus formatting, the shared-core portability gate, and the
# errors-as-values transpile ratchet.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      # The JVM execution lane compiles emitted Kotlin with this kotlinc. The
      # emitted subset (functions, sealed interfaces, data classes, smart casts,
      # `when`, string templates) is long-stable, so any 2.x compiles it
      # identically; pinned to the widely-deployed 2.1.x for reproducible CI.
      # NB: an older kotlinc cannot parse a *very* new JDK's version string, so
      # this pairs with the JDK 21 set up in the lane below (verified: 2.1.0 +
      # JDK 21 compiles the emitted output). Local dev uses its own kotlinc.
      KOTLIN_VERSION: "2.1.0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - name: Cache deps and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Fetch deps and compile
        run: |
          mix deps.get
          mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      # Portability gate, scoped to the shared core (ADR-0058 §"CI default scope").
      # Default-ON for prelude/shared-core, which must reach every Tier-1 target;
      # BEAM-pinned application code stays opt-in (it declares `@targets`, or nothing).
      # `prelude_int.rian`'s explicit `Int64` overflow ops (`wrapping_add`/`saturating_add`/
      # `checked_add`) carry 64-bit overflow prims and so are honestly off `:js` (ADR-0064
      # §2a) — gated against the targets they *can* reach, never silently dropped.
      # `prelude_list.rian` (incl. its `Fn(...)`-callback combinators `map`/`filter`/`reduce`/…)
      # is back to the full `ex,rs,js`: closure-as-value lowering landed (ADR-0061 — `&impl Fn`
      # params, `Box<dyn Fn>` returns).
      - name: Gate shared-core portability (ex,rs,js)
        run: |
          for f in examples/rian/prelude_*.rian; do
            req=ex,rs,js
            [ "$f" = examples/rian/prelude_int.rian ] && req=ex,rs
            echo "== $f (require $req) =="
            mix rian.targets "$f" --require "$req"
          done

      # Construct-compatibility gate (ADR-0035/0040): the transpiler flags
      # Rian-model-incompatible constructs — truthy `&&`/`||` (no truthy operators)
      # and exception flow (`def … rescue`/`catch`/`after`; errors are values). Fails
      # if any `lib/rian` file gains one beyond its ratchet baseline
      # (priv/transpile_check_baseline.txt), keeping the source in the portable subset
      # as the errors-as-values port proceeds. Re-baseline with `--update-baseline`.
      - name: Gate Rian-incompatible constructs (errors-as-values ratchet)
        run: mix rian.transpile lib/rian --check

      # `mix test.all` (not `mix test`) — the default loop excludes the
      # external-toolchain tests (`@tag :rust|:js|:jvm`) for inner-loop speed;
      # CI must run the full set or that coverage silently vanishes. The runner
      # ships rustc + node (those tests execute); kotlinc is NOT on PATH yet, so
      # the `:jvm` runs self-skip to their shape assertions here — JVM execution
      # is verified separately, non-blocking, in the Tier-2 lane below. This
      # blocking gate is therefore Tier 1 only (ADR-0049). See test/test_helper.exs.
      - name: Run the full suite (incl. external-toolchain tests)
        run: mix test.all

      # ── Tier-2 JVM execution lane (ADR-0049: non-blocking until promoted) ──
      # kotlinc is installed only after the blocking gate above, so it never makes
      # `mix test.all` block on a Tier-2 backend. `continue-on-error` keeps a JVM
      # regression visible on CI without failing the build — exactly the Tier-2
      # contract. The JVM emitter is ADR-0049 Tier 2; this becomes blocking only
      # if/when JVM is promoted to Tier 1 (which would also move it into test.all).
      - name: Set up JDK (kotlinc runtime)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache the Kotlin compiler
        uses: actions/cache@v5
        with:
          path: ~/kotlin-compiler
          key: kotlinc-${{ env.KOTLIN_VERSION }}

      - name: Install the Kotlin compiler
        run: |
          if [ ! -x "$HOME/kotlin-compiler/kotlinc/bin/kotlinc" ]; then
            curl -fsSL -o /tmp/kotlin.zip \
              "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
            mkdir -p "$HOME/kotlin-compiler"
            unzip -q /tmp/kotlin.zip -d "$HOME/kotlin-compiler"
          fi
          echo "$HOME/kotlin-compiler/kotlinc/bin" >> "$GITHUB_PATH"

      - name: JVM execution lane (Tier 2, non-blocking)
        continue-on-error: true
        run: |
          kotlinc -version
          mix test --only jvm

  # ── Dialyzer (success-typing) gate ─────────────────────────────────────────
  # Runs in the official `elixir` container — a FULL OTP build that BUNDLES the
  # `dialyzer` app. The `test` job stays on `ubuntu-latest` because that runner
  # preships rustc + node for the toolchain lanes; the precompiled OTP that
  # `erlef/setup-beam` installs there can omit `dialyzer`, which is why the oracle
  # test self-skips on that job. This dedicated container job keeps the compiler's
  # own Elixir dialyzer-clean (CLAUDE.md / mix.exs `dialyzer/0`). `dialyxir` is a
  # `:dev`-only dep, so this job runs in the default `dev` env (no `MIX_ENV: test`).
  dialyzer:
    runs-on: ubuntu-latest
    container: elixir:latest
    steps:
      - uses: actions/checkout@v7

      - name: Install hex + rebar
        run: mix local.hex --force && mix local.rebar --force

      # Cache deps, build, and the PLTs (`priv/plts/{core,project}.plt`, mix.exs
      # `dialyzer/0`) — the first PLT build is minutes-long; later runs are fast.
      - name: Cache deps, build, and PLTs
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-

      - name: Fetch deps
        run: mix deps.get

      - name: Dialyzer (builds the PLT on first run, then analyzes)
        run: mix dialyzer

  # ── JS playground-bundle freshness gate (ADR-0090) ─────────────────────────
  # `purs/scripts/js-bundle.sh --check` rebuilds the committed browser bundle
  # (`site/public/rian-compiler.mjs`) from source — the stock-`purs` JS backend
  # (`js-build.sh`) + esbuild — and asserts byte-identity with the committed artifact,
  # so the playground can never serve a compiler that disagrees with the source (it has
  # already caught a real stale bundle). Reproducible inputs make the byte check sound:
  # purs 0.15.16 + spago (`purs/package-lock.json`), the dhall JS package set (hash-pinned
  # in `packages-js.dhall`), and esbuild (`site/package-lock.json`) all via `npm ci`, and
  # esbuild `--minify` is deterministic. NON-BLOCKING until a few green runs confirm
  # cross-environment byte-reproducibility, then promote (drop `continue-on-error`) — the
  # same "non-blocking until promoted" contract as the Tier-2 JVM lane above.
  js-bundle:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache the purs toolchain, JS package set, and esbuild
        uses: actions/cache@v5
        with:
          path: |
            purs/node_modules
            purs/.spago
            site/node_modules
          key: ${{ runner.os }}-jsbundle-${{ hashFiles('purs/package-lock.json', 'purs/spago-js.dhall', 'purs/packages-js.dhall', 'site/package-lock.json') }}

      # `npm ci` (not `install`) for byte-reproducible toolchains from the lock files.
      - name: Install purs + spago (purs/) and esbuild (site/)
        run: |
          (cd purs && npm ci)
          (cd site && npm ci)

      - name: Bundle freshness gate (committed rian-compiler.mjs == clean rebuild)
        run: purs/scripts/js-bundle.sh --check
